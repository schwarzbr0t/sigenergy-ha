refresh_systems:
  name: Refresh systems
  description: >
    Clear the cached system and device list and re-query the Sigenergy Cloud API.
    Use this after adding a new system to your Sigenergy account so Home Assistant
    can discover it without removing and re-adding the integration.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Optional. Limit the refresh to a single Sigenergy Cloud config entry
        (by entry_id). If omitted, all Sigenergy Cloud entries are refreshed.
      required: false
      example: "01J5A1B2C3D4E5F6G7H8J9K0L1"
      selector:
        config_entry:
          integration: sigenergy

backfill_statistics:
  name: Backfill statistics
  description: >
    Import daily energy history from the Sigenergy Cloud into the long-term
    statistics of the Total energy sensors (grid import/export, battery
    charging/discharging, home consumption) and Lifetime PV Generation, so the
    Energy Dashboard shows days before Home Assistant started recording them.
    Runs in the background: one month is fetched about every 10 minutes
    because of the API rate limit.
  fields:
    system_id:
      name: System ID
      description: >
        Optional. The Sigenergy system (installation) ID, for example
        NDXZZ1731665796. If omitted, all systems are backfilled.
      required: false
      example: "NDXZZ1731665796"
      selector:
        text:
    start_date:
      name: Start date
      description: First day to import.
      required: true
      example: "2025-01-01"
      selector:
        date:
    end_date:
      name: End date
      description: >
        Last day to import. Days on which a sensor already has statistics,
        and today, are skipped.
      required: true
      example: "2025-12-31"
      selector:
        date:
